{ifloop rel="blog.articles"}
<ul class="menu-list list-unstyled">
    {loop type="content" name="blog.articles" folder=$bodyFolderId limit=3}
    <li class="menu-item">
        <a href="{$URL}" class="nav-link">{$TITLE}</a>
        <p>{$CHAPO}</p>
    </li>
    {/loop}
</ul>
{/ifloop}
{elseloop rel="blog.articles"}
<ul class="menu-list list-unstyled">
    <li class="menu-item">{intl l="No articles currently" d="hooknavigation.fo.default"}</li>
</ul>
{/elseloop}
