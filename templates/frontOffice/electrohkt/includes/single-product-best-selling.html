{if not $product_id}
{assign var="product_id" value=$ID}
{/if}

<div class="product-item swiper-slide">
    {if $IS_PROMO == 1}
    <span class="badge bg-success position-absolute m-3">Afford it for only {$PROMO_PRICE} € (instead of {$PRICE})
        !</span>
    {else}
    <span class="badge bg-success position-absolute m-3"> {$PROMO_PRICE} | {$PRICE})
        !</span>
    {/if}

    <a href="#" class="btn-wishlist"><svg width="24" height="24">
            <use xlink:href="#heart"></use>
        </svg></a>
    <figure>

        <a href="{$URL}" itemprop="url" title="{$TITLE}">
            {ifloop rel="image_product_best_seliing" }
            {$IMAGE_URL}
            <img itemprop="image" class="tab-image" {loop name="image_product_best_seliing" type="image" limit="1"
                product="{$product_id}" force_return="true" } src="{$IMAGE_URL}" {/loop} alt="{$TITLE}">
            {/ifloop}
            {elseloop rel="image_product_best_seliing"}
            <img itemprop="image" class="tab-image" src="{image file='assets/dist/img/280x196.png'}"
                alt="Product #{$LOOP_COUNT}">
            {/elseloop}
        </a>
    </figure>
    <h3>{$TITLE}</h3>
    <span class="qty">1 Unit</span><span class="rating"><svg width="24" height="24" class="text-primary">
            <use xlink:href="#star-solid"></use>
        </svg> 4.5</span>
    <span class="price">{format_money number=$BEST_TAXED_PRICE}</span>
    <div class="d-flex align-items-center justify-content-between">
        <div class="input-group product-qty">
            <span class="input-group-btn">
                <button type="button" class="quantity-left-minus btn btn-danger btn-number" data-type="minus">
                    <svg width="16" height="16">
                        <use xlink:href="#minus"></use>
                    </svg>
                </button>
            </span>
            <input type="text" id="quantity" name="quantity" class="form-control input-number" value="1">
            <span class="input-group-btn">
                <button type="button" class="quantity-right-plus btn btn-success btn-number" data-type="plus">
                    <svg width="16" height="16">
                        <use xlink:href="#plus"></use>
                    </svg>
                </button>
            </span>
        </div>
        <a href="#" class="nav-link">{intl l="Add to cart"} <iconify-icon icon="uil:shopping-cart"></a>
    </div>
</div>
